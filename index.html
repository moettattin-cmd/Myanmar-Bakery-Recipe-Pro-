play:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}textarea{min-height:90px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{padding:9px 5px;border-bottom:1px solid #f0e5d8;text-align:left}.table td:last-child,.table th:last-child{text-align:right}.pill{display:inline-block;background:#f7ecd9;color:#80501f;padding:5px 9px;border-radius:30px;font-size:11px}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hidden{display:none!important}.notice{background:#fff3d9;border:1px solid #f0d39b;border-radius:12px;padding:11px;font-size:12px;color:#73501f}.photo{max-width:100%;border-radius:12px;margin-top:8px}.calc-result{font-size:22px;color:#26734b;font-weight:750}.footer{text-align:center;color:#9a806a;font-size:11px;padding:12px}

<body><main class="app"><header class="top"><div class="brand"><div class="logo">👨‍🍳</div><div><h1>Bakery Recipe Pro</h1><p>မုန့်ဆရာတို့ရဲ့ ကိုယ်ပိုင် Recipe စာအုပ်</p></div></div><p class="sub">🍞 ပေါင်မုန့် သီးသန့်　　🎂 ကိတ်မုန့် သီးသန့်</p></header><div class="content" id="app"></div><div class="footer">Bakery Recipe Pro · Your baking companion</div></main>
<script>
const breadTypes=['ပေါင်မုန့်ရိုးရိုး','နို့ပေါင်မုန့်','ထောပတ်ပေါင်မုန့်','Sandwich ပေါင်မုန့်','Sweet Bread'];
const cakeTypes=['Butter Cake','Sponge Cake','Chiffon Cake','Birthday Cake','Cheese Cake','Chocolate Cake'];
const starter=[{id:'demo-bread',category:'bread',type:'ပေါင်မုန့်ရိုးရိုး',name:'နမူနာ ပေါင်မုန့် Recipe',yield:10,ingredients:[{name:'ဂျုံမှုန့်',qty:1000,unit:'g',price:0},{name:'သကြား',qty:100,unit:'g',price:0},{name:'ထောပတ်',qty:80,unit:'g',price:0},{name:'ကြက်ဥ',qty:2,unit:'လုံး',price:0},{name:'Yeast',qty:15,unit:'g',price:0}],steps:'ပါဝင်ပစ္စည်းများကို ချိန်တွယ်ပါ။\nမုန့်သားကို ရောနယ်ပြီး အုံတက်အောင်ထားပါ။\nပုံဖော်ပြီး ထပ်မံအုံတက်စေပါ။\nမီးဖိုအပူချိန်နှင့် အချိန်ကို မိမိမီးဖိုအလိုက် ချိန်ညှိဖုတ်ပါ။',temperature:'မိမိမီးဖိုအလိုက်',time:'မိမိမီးဖိုအလိုက်',photo:''}];
let recipes=JSON.parse(localStorage.getItem('brp_recipes')||'null')||starter;let page='home',category='bread',type='',editing=null;
const save=()=>localStorage.setItem('brp_recipes',JSON.stringify(recipes));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){page='home';render()}function go(p){page=p;render()}function list(cat,t=''){category=cat;type=t;page='list';render()}
function render(){const el=document.getElementById('app');if(page==='home')el.innerHTML=`<h2 class="section-title">အဓိက Menu</h2><div class="grid"><button class="tile" onclick="list('bread')"><div class="emoji">🍞</div><strong>ပေါင်မုန့်</strong><small>ပေါင်မုန့် Recipe များ</small></button><button class="tile" onclick="list('cake')"><div class="emoji">🎂</div><strong>ကိတ်မုန့်</strong><small>ကိတ်မုန့် Recipe များ</small></button><button class="tile" onclick="go('calculator')"><div class="emoji">🧮</div><strong>အချိုးတွက်စက်</strong><small>ထုတ်လုပ်မည့်အရေအတွက်အလိုက်</small></button><button class="tile" onclick="go('all')"><div class="emoji">📒</div><strong>ကိုယ်ပိုင် Recipe</strong><small>သိမ်းဆည်းထားသော Recipe များ</small></button><button class="tile" onclick="go('decoration')"><div class="emoji">🎨</div><strong>ကိတ်အလှဆင်နည်း</strong><small>Cream၊ ပန်းပုံဖော်၊ Drip နည်းများ</small></button><button class="tile" onclick="go('filling')"><div class="emoji">🍓</div><strong>ကိတ်အတွင်း Filling</strong><small>Jam၊ Custard၊ Ganache များ</small></button></div><div class="panel"><strong>အသုံးဝင်သော လုပ်ဆောင်ချက်များ</strong><div class="nav"><span class="pill">အချိုးအစားတွက်ချက်ခြင်း</span><span class="pill">ကုန်ကျစရိတ်တွက်ခြင်း</span><span class="pill">ဓာတ်ပုံသိမ်းခြင်း</span><span class="pill">Offline အသုံးပြုခြင်း</span></div></div><div class="panel"><strong>ဒေတာ Backup / Restore</strong><p class="muted">Recipe များကို JSON ဖိုင်အဖြစ် သိမ်းဆည်းပြီး ဖုန်းပြောင်းသည့်အခါ ပြန်ထည့်နိုင်သည်။</p><button class="btn small" onclick="backupData()">Backup ထုတ်ရန်</button> <label style="display:inline-block;margin-left:8px"><span class="btn small light">Backup ပြန်ထည့်ရန်</span><input type="file" accept="application/json" onchange="restoreData(event)" style="display:none"></label></div><div class="notice">Recipe များကို ယခုဖုန်း၏ Browser ထဲတွင် သိမ်းဆည်းထားပါသည်။ Backup ကို ပုံမှန်ထုတ်ထားပါ။</div>`;
else if(page==='list'){let types=category==='bread'?breadTypes:cakeTypes;let arr=recipes.filter(r=>r.category===category&&(!type||r.type===type));el.innerHTML=`<button class="back" onclick="home()">← ပင်မစာမျက်နှာ</button><h2 class="section-title">${category==='bread'?'🍞 ပေါင်မုန့်':'🎂 ကိတ်မုန့်'} အမျိုးအစားများ</h2><div class="nav">${types.map(t=>`<button class="btn small ${type===t?'':'light'}" onclick="list('${category}','${esc(t)}')">${esc(t)}</button>`).join('')}<button class="btn small light" onclick="list('${category}','')">အားလုံး</button></div><div class="row"><strong>${type?esc(type):'Recipe အားလုံး'}</strong><button class="btn small" onclick="formRecipe('${category}')">＋ Recipe အသစ်</button></div><div class="list" style="margin-top:12px">${arr.length?arr.map(r=>`<button class="item" onclick="detail('${r.id}')"><span><strong>${esc(r.name)}</strong><small>${esc(r.type)} · ${r.yield} ခုစာ</small></span><b>›</b></button>`).join(''):'<div class="empty">ဒီအမျိုးအစားအတွက် Recipe မရှိသေးပါ။<br>Recipe အသစ်ထည့်နိုင်ပါတယ်။</div>'}</div>`}
else if(page==='all'){el.innerHTML=`<button class="back" onclick="home()">← ပင်မစာမျက်နှာ</button><h2 class="section-title">📒 သိမ်းဆည်းထားသော Recipe များ</h2><div class="list">${recipes.map(r=>`<button class="item" onclick="detail('${r.id}')"><span><strong>${esc(r.name)}</strong><small>${r.category==='bread'?'ပေါင်မုန့်':'ကိတ်မုန့်'} · ${esc(r.type)}</small></span>›</button>`).join('')}</div>`}
else if(page==='decoration')libraryView(el,'decoration');else if(page==='filling')libraryView(el,'filling');else if(page==='detail')detailView(el);
else if(page==='form')formView(el);
else if(page==='calculator')calcView(el);
}

const bakingLibrary={
decoration:[
{name:'Whipped Cream ဖြင့် အလှဆင်ခြင်း',level:'အခြေခံ',ingredients:'Whipping cream 500 ml\nသကြားမှုန့် 30–40 g\nVanilla 1 tsp (ရွေးချယ်နိုင်)',steps:'1. Cream နှင့် ပန်းကန်/ခေါင်းတံများကို အေးအောင်ထားပါ။\n2. Cream ကို အလယ်အလတ်အမြန်နှုန်းဖြင့် စတင်မွှေပါ။\n3. သကြားမှုန့်ကို ဖြည်းဖြည်းထည့်ပါ။\n4. ပုံဖော်နိုင်သော stiff peak ရောက်သည်အထိ မွှေပါ။ အလွန်အကျွံမမွှေပါနှင့်။\n5. အေးသောကိတ်ပေါ်တွင် spatula သို့မဟုတ် piping bag ဖြင့် အလှဆင်ပါ။',tip:'အပူချိန်မြင့်လျှင် cream ပျော့လွယ်သည်။ အလုပ်လုပ်နေစဉ် အေးခန်းထဲ ပြန်ထားပါ။'},
{name:'Buttercream ပန်းပုံဖော်ခြင်း',level:'အလယ်အလတ်',ingredients:'Unsalted butter 250 g\nIcing sugar 400–450 g\nနို့ 1–2 tbsp\nVanilla အနည်းငယ်',steps:'1. Butter ကို အရောင်ဖျော့ပြီး ပွလာသည်အထိ မွှေပါ။\n2. Icing sugar ကို အပိုင်းလိုက်ထည့်ပြီး မွှေပါ။\n3. လိုအပ်သလို နို့အနည်းငယ်ထည့်ကာ piping လုပ်နိုင်သောအနေအထား ချိန်ပါ။\n4. Food colour ကို အနည်းငယ်စီ ထည့်ပါ။\n5. Star tip ဖြင့် rosette၊ leaf tip ဖြင့် အရွက်ပုံ၊ petal tip ဖြင့် ပန်းပွင့်ပုံ ဖော်ပါ။',tip:'အရမ်းပျော့လျှင် အေးခန်းထဲ ခဏထားပါ။ အရမ်းမာလျှင် နို့ကို လက်ဖက်ရည်ဇွန်းလိုက် ထည့်ပါ။'},
{name:'Chocolate Ganache Drip',level:'အလယ်အလတ်',ingredients:'Dark chocolate 200 g\nWhipping cream 200 ml',steps:'1. Cream ကို အငွေ့ထွက်ပြီး အနားတွင် ပူဖောင်းသေးသေးပေါ်သည်အထိ အပူပေးပါ။ မပြုတ်ပါစေနှင့်။\n2. Chocolate ပေါ်လောင်းပြီး 2 မိနစ်ခန့် ထားပါ။\n3. ချောမွေ့သည်အထိ မွှေပါ။\n4. အသုံးပြုနိုင်သော အပူချိန်ရောက်အောင် အနည်းငယ်အေးစေပါ။\n5. အေးပြီးသား ကိတ်အစွန်းတွင် အနည်းငယ်ချင်းလောင်း၍ drip ပုံဖော်ပါ။',tip:'Drip မလုပ်မီ ကိတ်ကို အေးခန်းထားပါ။ Ganache အရမ်းပူနေစဉ် မလောင်းပါနှင့်။'}
],
filling:[
{name:'Strawberry Jam Filling',level:'အခြေခံ',ingredients:'စတော်ဘယ်ရီ 300 g\nသကြား 120 g\nသံပုရာရည် 1 tbsp',steps:'1. စတော်ဘယ်ရီကို သန့်စင်ပြီး အတုံးသေးသေးလှီးပါ။\n2. သကြားနှင့်ရောပြီး 10 မိနစ်ခန့်ထားပါ။\n3. မီးအလယ်အလတ်ဖြင့် ပျစ်လာသည်အထိ ချက်ပါ။\n4. သံပုရာရည်ထည့်ပြီး 1–2 မိနစ် ထပ်ချက်ပါ။\n5. လုံးဝအေးသွားမှ ကိတ်အလွှာကြားတွင် အသုံးပြုပါ။',tip:'သန့်ရှင်းသောဘူးထဲထည့်၍ အအေးခန်းတွင်ထားပြီး အချိန်တိုအတွင်း အသုံးပြုပါ။'},
{name:'Vanilla Custard Filling',level:'အလယ်အလတ်',ingredients:'နို့ 500 ml\nကြက်ဥအနှစ် 4 လုံး\nသကြား 100 g\nCornflour 40 g\nVanilla 1 tsp\nButter 25 g',steps:'1. ကြက်ဥအနှစ်၊ သကြား၊ cornflour ကို ချောမွေ့အောင် ရောမွှေပါ။\n2. နို့ကို ပူနွေးလာသည်အထိ အပူပေးပါ။\n3. နို့ပူကို ကြက်ဥအရောထဲ ဖြည်းဖြည်းလောင်း၍ မွှေပါ။\n4. အိုးထဲပြန်ထည့်ပြီး ပျစ်လာသည်အထိ မီးအလယ်အနိမ့်ဖြင့် မွှေချက်ပါ။\n5. မီးပိတ်ပြီး vanilla နှင့် butter ထည့်ပါ။\n6. အမြန်အေးစေပြီး အအေးခန်းထားပါ။',tip:'နို့/ကြက်ဥပါဝင်သောကြောင့် အခန်းအပူချိန်တွင် ကြာရှည်မထားပါနှင့်။'},
{name:'Chocolate Ganache Filling',level:'အခြေခံ',ingredients:'Dark chocolate 200 g\nWhipping cream 150–200 ml',steps:'1. Chocolate ကို အတုံးသေးသေးလှီးပါ။\n2. Cream ကို ပူနွေးလာသည်အထိ အပူပေးပါ။\n3. Chocolate ပေါ်လောင်းပြီး 2 မိနစ်ထားပါ။\n4. ချောမွေ့သည်အထိ မွှေပါ။\n5. ပျစ်လာသည်အထိ အေးစေပြီး ကိတ်အလွှာကြားတွင် ထည့်ပါ။',tip:'ပိုမာသော filling လိုလျှင် chocolate ပမာဏတိုးပါ။'}
]};
function libraryView(el,kind){
 const arr=bakingLibrary[kind],title=kind==='decoration'?'🎨 ကိတ်အလှဆင်နည်း':'🍓 ကိတ်အတွင်း Filling';
 el.innerHTML=`<button class="back" onclick="home()">← ပင်မစာမျက်နှာ</button><h2 class="section-title">${title}</h2><p class="muted">ပါဝင်ပစ္စည်း၊ အဆင့်လိုက်ပြုလုပ်နည်းနှင့် လက်တွေ့အသုံးဝင်သော အကြံပြုချက်များ</p><div class="list">${arr.map((x,i)=>`<button class="item" onclick="showLibraryItem('${kind}',${i})"><span><strong>${esc(x.name)}</strong><small>${esc(x.level)}</small></span><b>›</b></button>`).join('')}</div>`;
}
function showLibraryItem(kind,i){
 const x=bakingLibrary[kind][i],el=document.getElementById('app');
 el.innerHTML=`<button class="back" onclick="go('${kind}')">← နောက်သို့</button><h2 class="section-title">${esc(x.name)}</h2><span class="pill">${esc(x.level)}</span><div class="panel"><strong>ပါဝင်ပစ္စည်းများ</strong><p style="white-space:pre-line">${esc(x.ingredients)}</p></div><div class="panel"><strong>ပြုလုပ်နည်း အဆင့်ဆင့်</strong><p style="white-space:pre-line">${esc(x.steps)}</p></div><div class="notice"><b>မုန့်ဆရာအကြံပြုချက်</b><br>${esc(x.tip)}</div>`;
}

function detail(id){editing=id;page='detail';render()}function detailView(el){let r=recipes.find(x=>x.id===editing);if(!r)return home();el.innerHTML=`<button class="back" onclick="list('${r.category}')">← နောက်သို့</button><h2 class="section-title">${esc(r.name)}</h2><span class="pill">${esc(r.type)} · မူလ ${r.yield} ခုစာ</span>${r.photo?`<img class="photo" src="${r.photo}">`:''}<div class="panel"><div class="row"><strong>ပါဝင်ပစ္စည်းများ</strong><button class="btn small light" onclick="ratio('${r.id}')">အချိုးတွက်ရန်</button></div><table class="table"><tr><th>ပစ္စည်း</th><th>ပမာဏ</th><th>ကုန်ကြမ်းဖိုး</th></tr>${r.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty} ${esc(i.unit)}</td><td>${Number(i.price||0).toLocaleString()} ကျပ်</td></tr>`).join('')}</table><p><b>စုစုပေါင်းကုန်ကြမ်းဖိုး:</b> ${r.ingredients.reduce((a,i)=>a+Number(i.price||0),0).toLocaleString()} ကျပ်</p></div><div class="panel"><strong>ပြုလုပ်နည်း</strong><p style="white-space:pre-line">${esc(r.steps)}</p><p>ဖုတ်အပူချိန်: ${esc(r.temperature||'မသတ်မှတ်ရသေး')}<br>ဖုတ်ချိန်: ${esc(r.time||'မသတ်မှတ်ရသေး')}</p></div><div class="row"><button class="btn" onclick="formRecipe('${r.category}','${r.id}')">ပြင်ဆင်ရန်</button><button class="btn danger" onclick="removeRecipe('${r.id}')">ဖျက်ရန်</button></div>`}
function formRecipe(cat,id=''){category=cat;editing=id||null;page='form';render()}function formView(el){let r=recipes.find(x=>x.id===editing)||{name:'',type:'',yield:10,ingredients:[],steps:'',temperature:'',time:'',photo:'',category};el.innerHTML=`<button class="back" onclick="list('${category}')">← နောက်သို့</button><h2 class="section-title">Recipe ${editing?'ပြင်ဆင်ရန်':'အသစ်ထည့်ရန်'}</h2><form id="recipeForm"><label>မုန့်အမည်</label><input name="name" required value="${esc(r.name)}" placeholder="ဥပမာ - နို့ပေါင်မုန့်"><label>အမျိုးအစား</label><select name="type">${(category==='bread'?breadTypes:cakeTypes).map(t=>`<option ${r.type===t?'selected':''}>${esc(t)}</option>`).join('')}<option ${r.type==='အခြား'?'selected':''}>အခြား</option></select><label>မူလထုတ်လုပ်နိုင်သည့် အရေအတွက်</label><input name="yield" type="number" min="1" required value="${r.yield}"><label>ပါဝင်ပစ္စည်းများ (တစ်ကြောင်းလျှင် ပစ္စည်းတစ်မျိုး)</label><textarea name="ingredients" placeholder="ဂျုံမှုန့်,1000,g,2500&#10;သကြား,100,g,300">${r.ingredients.map(i=>`${i.name},${i.qty},${i.unit},${i.price||0}`).join('\n')}</textarea><small class="muted">ပုံစံ: ပစ္စည်းအမည်, ပမာဏ, ယူနစ်, ကုန်ကျစရိတ်(ကျပ်)</small><label>ပြုလုပ်နည်း အဆင့်ဆင့်</label><textarea name="steps">${esc(r.steps)}</textarea><div class="fields"><div><label>ဖုတ်အပူချိန်</label><input name="temperature" value="${esc(r.temperature)}" placeholder="ဥပမာ 180°C"></div><div><label>ဖုတ်ချိန်</label><input name="time" value="${esc(r.time)}" placeholder="ဥပမာ 25 မိနစ်"></div></div><label>မုန့်ဓာတ်ပုံ</label><input name="photo" type="file" accept="image/*"><button class="btn full" type="submit">Recipe သိမ်းဆည်းမယ်</button></form>`;
el.querySelector('form').onsubmit=async e=>{e.preventDefault();let f=e.target,lines=f.ingredients.value.split('\n').map(x=>x.trim()).filter(Boolean),ingredients=lines.map(line=>{let [name,qty,unit,price]=line.split(',').map(x=>x.trim());return{name,qty:Number(qty)||0,unit:unit||'g',price:Number(price)||0}});let photo=r.photo||'';if(f.photo.files[0])photo=await new Promise(resolve=>{let rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.readAsDataURL(f.photo.files[0])});let obj={id:editing||crypto.randomUUID(),category,name:f.name.value,type:f.type.value,yield:Number(f.yield.value),ingredients,steps:f.steps.value,temperature:f.temperature.value,time:f.time.value,photo};if(editing)recipes=recipes.map(x=>x.id===editing?obj:x);else recipes.push(obj);save();detail(obj.id)} }
function ratio(id){editing=id;page='ratio';renderRatio()}function renderRatio(){let el=document.getElementById('app'),r=recipes.find(x=>x.id===editing);el.innerHTML=`<button class="back" onclick="detail('${r.id}')">← နောက်သို့</button><h2 class="section-title">အချိုးအစားတွက်စက်</h2><div class="panel"><strong>${esc(r.name)}</strong><label>လိုချင်သော အရေအတွက်</label><input id="target" type="number" min="1" value="${r.yield*2}"><div id="ratioRows"></div></div>`;document.getElementById('target').oninput=()=>{let f=Number(document.getElementById('target').value)/r.yield;document.getElementById('ratioRows').innerHTML=`<table class="table"><tr><th>ပစ္စည်း</th><th>လိုအပ်မည့်ပမာဏ</th></tr>${r.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td>${(i.qty*f).toLocaleString()} ${esc(i.unit)}</td></tr>`).join('')}</table>`};document.getElementById('target').oninput()}
function calcView(el){el.innerHTML=`<button class="back" onclick="home()">← ပင်မစာမျက်နှာ</button><h2 class="section-title">🧮 အချိုးတွက်စက်</h2><label>Recipe ရွေးချယ်ပါ</label><select id="recipePick">${recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><label>လိုချင်သော အရေအတွက်</label><input id="calcTarget" type="number" min="1" value="20"><div id="calcOut" class="panel"></div>`;let update=()=>{let r=recipes.find(x=>x.id===document.getElementById('recipePick').value),n=Number(document.getElementById('calcTarget').value)||0,f=n/r.yield;document.getElementById('calcOut').innerHTML=`<strong>${n} ခုစာအတွက် လိုအပ်မည့်ပစ္စည်းများ</strong><table class="table">${r.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td>${(i.qty*f).toLocaleString()} ${esc(i.unit)}</td></tr>`).join('')}</table><p>ခန့်မှန်းကုန်ကြမ်းဖိုး: <b>${(r.ingredients.reduce((a,i)=>a+Number(i.price||0),0)*f).toLocaleString()} ကျပ်</b></p>`};document.getElementById('recipePick').onchange=update;document.getElementById('calcTarget').oninput=update;update()}
function backupData(){const blob=new Blob([JSON.stringify({version:2,recipes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bakery-recipe-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(e){const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const data=JSON.parse(rd.result);if(!Array.isArray(data.recipes))throw new Error('invalid');if(confirm('လက်ရှိ Recipe များကို Backup ထဲက Recipe များဖြင့် အစားထိုးမလား။')){recipes=data.recipes;save();home();alert('Backup ပြန်ထည့်ပြီးပါပြီ။')}}catch(err){alert('Backup ဖိုင် မမှန်ကန်ပါ။')}};rd.readAsText(file)}
function removeRecipe(id){if(confirm('ဒီ Recipe ကို ဖျက်မှာ သေချာပါသလား။')){recipes=recipes.filter(r=>r.id!==id);save();home()}}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
